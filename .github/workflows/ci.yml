name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck + build
        run: npm run build

      # PERF-1 / FR-7 budget gate: the entry chunk must stay ≤200 KB gzipped
      # and MediaPipe must never leak back into it.
      - name: Bundle budget gate
        run: |
          set -euo pipefail
          ENTRY=$(ls dist/assets/index-*.js)
          GZ=$(gzip -c "$ENTRY" | wc -c)
          echo "Entry chunk: $ENTRY — ${GZ} bytes gzipped"
          if [ "$GZ" -gt 204800 ]; then
            echo "::error::Entry chunk exceeds 200 KB gzipped budget (${GZ} bytes)"
            exit 1
          fi
          if grep -q "HandLandmarker" "$ENTRY"; then
            echo "::error::MediaPipe leaked into the entry chunk — check code splitting in src/App.tsx"
            exit 1
          fi
          echo "Budget OK"
